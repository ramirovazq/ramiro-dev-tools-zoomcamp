<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple TODO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-primary: #fafafa;
        --bg-secondary: #ffffff;
        --bg-tertiary: #f5f5f5;
        --text-primary: #1a1a1a;
        --text-secondary: #6b7280;
        --text-muted: #9ca3af;
        --border-color: #e5e7eb;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --danger: #dc2626;
        --danger-hover: #b91c1c;
        --success: #16a34a;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --radius: 8px;
        --radius-lg: 12px;
        --transition: all 0.2s ease;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
      }

      .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      .header {
        margin-bottom: 40px;
        text-align: center;
      }

      .header h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--text-primary);
      }

      .header p {
        color: var(--text-secondary);
        margin-top: 8px;
        font-size: 0.95rem;
      }

      /* Cards */
      .card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 20px;
        box-shadow: var(--shadow-sm);
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 18px;
        font-size: 0.875rem;
        font-weight: 500;
        font-family: inherit;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        text-decoration: none;
        transition: var(--transition);
        white-space: nowrap;
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }

      .btn-secondary {
        background: var(--bg-tertiary);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }

      .btn-secondary:hover {
        background: var(--border-color);
      }

      .btn-danger {
        background: var(--danger);
        color: white;
      }

      .btn-danger:hover {
        background: var(--danger-hover);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }

      .btn-ghost {
        background: transparent;
        color: var(--text-secondary);
        padding: 8px 12px;
      }

      .btn-ghost:hover {
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }

      .btn-sm {
        padding: 6px 12px;
        font-size: 0.8125rem;
      }

      /* Forms */
      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: 6px;
      }

      input[type="text"],
      input[type="date"],
      textarea,
      select {
        width: 100%;
        padding: 10px 14px;
        font-size: 0.9375rem;
        font-family: inherit;
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        background: var(--bg-secondary);
        color: var(--text-primary);
        transition: var(--transition);
      }

      input[type="text"]:focus,
      input[type="date"]:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      textarea {
        resize: vertical;
        min-height: 100px;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .checkbox-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .checkbox-wrapper label {
        font-size: 0.9375rem;
        cursor: pointer;
      }

      /* Utilities */
      .text-muted {
        color: var(--text-muted);
        font-size: 0.875rem;
      }

      .text-secondary {
        color: var(--text-secondary);
      }

      .mt-1 { margin-top: 4px; }
      .mt-2 { margin-top: 8px; }
      .mt-3 { margin-top: 12px; }
      .mt-4 { margin-top: 16px; }
      .mt-6 { margin-top: 24px; }
      .mb-4 { margin-bottom: 16px; }
      .mb-6 { margin-bottom: 24px; }

      .flex { display: flex; }
      .items-center { align-items: center; }
      .justify-between { justify-content: space-between; }
      .gap-2 { gap: 8px; }
      .gap-3 { gap: 12px; }

      form.inline {
        display: inline;
      }

      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-in {
        animation: fadeIn 0.3s ease-out;
      }

      /* Responsive */
      @media (max-width: 640px) {
        .container {
          padding: 24px 16px;
        }

        .header h1 {
          font-size: 1.5rem;
        }

        .btn {
          padding: 8px 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>✓ TODO</h1>
        <p>Organiza tus tareas</p>
      </header>
      <main class="animate-in">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
